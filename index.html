<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trade Bot V26 (Zero-Delay & Auto-Reconnect)</title>
    <style>
        :root {
            --bg-dark: #0f111a; --card-bg: #1c1f2e; --bg-alt: #252a3d;
            --text-primary: #ffffff; --text-secondary: #8b9bb4;
            --accent-blue: #3b82f6; --accent-red: #ef4444; 
            --accent-green: #10b981; --accent-orange: #f97316;
            --accent-purple: #8b5cf6; --accent-cyan: #06b6d4;
        }
        
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-dark); color: var(--text-primary); margin: 0; padding: 20px; display: flex; justify-content: center; }
        
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-1 { flex: 1; } .flex-2 { flex: 2; }
        .mb-1 { margin-bottom: 5px; } .mb-2 { margin-bottom: 10px; } .mb-3 { margin-bottom: 15px; }
        .mt-1 { margin-top: 5px; } .mt-2 { margin-top: 8px; }
        .text-center { text-align: center; } .text-right { text-align: right; }
        .text-sm { font-size: 0.8em; } .text-xs { font-size: 0.75em; }
        .bold { font-weight: bold; }
        
        .c-green { color: var(--accent-green); } .c-red { color: var(--accent-red); }
        .c-blue { color: var(--accent-blue); } .c-orange { color: var(--accent-orange); }
        .c-cyan { color: var(--accent-cyan); } .c-muted { color: var(--text-secondary); }
        
        .container { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #2d3748; }
        .header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .header-border { border-bottom: 1px solid #2d3748; padding-bottom: 10px; margin-bottom: 15px; }
        
        input, select { background-color: var(--bg-dark); border: 1px solid #2d3748; color: white; padding: 10px; border-radius: 6px; width: 100%; }
        label { font-size: 0.8em; color: var(--text-secondary); margin-bottom: 4px; display: block; }
        
        /* Toggle Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #2d3748; transition: .3s; border-radius: 22px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-purple); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Displays & Grids */
        .target-display { background: rgba(59, 130, 246, 0.1); border: 2px solid var(--accent-blue); color: var(--accent-blue); padding: 15px; border-radius: 8px; text-align: center; transition: all 0.3s; }
        .target-number { font-size: 2.5em; font-weight: bold; }
        
        .digit-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .digit-box { background-color: #2d3748; border-radius: 8px; padding: 8px 4px; text-align: center; transition: all 0.1s; border: 2px solid transparent; cursor: pointer; position: relative; min-height: 60px; display: flex; flex-direction: column; justify-content: center; }
        .digit-box:hover { background-color: #374151; }
        
        .cold-digit { background-color: rgba(59, 130, 246, 0.15); border-color: var(--accent-blue); }
        .hot-digit { border-color: var(--accent-red); opacity: 0.8; }
        .manual-digit { background-color: rgba(249, 115, 22, 0.2) !important; border-color: var(--accent-orange) !important; }
        .active-tick { background-color: #ffffff !important; color: #000000 !important; transform: scale(1.1); z-index: 10; }

        .badge { font-size: 0.6em; padding: 2px 6px; border-radius: 4px; position: absolute; top: -5px; right: -5px; font-weight: bold; display: none; z-index: 5; color: white; }
        .cold-digit .badge-cold { display: block; background: var(--accent-blue); }
        .hot-digit .badge-hot { display: block; background: var(--accent-red); }
        
        .result-emoji { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.8em; opacity: 0; pointer-events: none; transition: all 0.4s ease-out; z-index: 20; }
        .show-emoji { opacity: 1; transform: translate(-50%, -80%); }

        /* Buttons */
        .btn { border: none; padding: 12px; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; width: 100%; margin-bottom: 8px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-connect { background: var(--accent-blue); }
        .btn-green { background: var(--accent-green); }
        .btn-stop { background: var(--accent-red); display: none; }
        
        /* Stats & Logs */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .stat-cell { background: var(--bg-alt); border-radius: 8px; padding: 10px 8px; text-align: center; }
        .stat-value { font-size: 1.3em; font-weight: bold; font-family: monospace; display: block; }
        .stat-label { font-size: 0.65em; color: var(--text-secondary); text-transform: uppercase; }
        
        .log-area { font-family: monospace; font-size: 0.8em; height: 160px; overflow-y: auto; background: var(--bg-dark); padding: 10px; border-radius: 6px; border: 1px solid #2d3748; }
        .log-win { color: var(--accent-green); } .log-loss { color: var(--accent-red); }
        .log-info { color: var(--text-secondary); } .log-warn { color: var(--accent-orange); }

        /* Martingale Box */
        .recovery-box { background: rgba(139, 92, 246, 0.05); border: 1px solid var(--accent-purple); padding: 12px; border-radius: 8px; }
        .data-row { display: flex; justify-content: space-between; padding: 8px; background: var(--bg-alt); border-radius: 6px; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header header-border">
            <span>🔌 Connection</span>
            <span id="statusText" class="text-sm c-red">Disconnected</span>
        </div>
        <div id="loginForm" class="flex-row">
            <input type="password" id="apiToken" placeholder="Deriv API Token" class="flex-2 mb-0">
            <button class="btn btn-connect flex-1 mb-0" onclick="App.connectAPI()">Connect</button>
        </div>
        <div id="accountInfo" style="display:none;">
            <div class="flex-between">
                <span>Balance:</span>
                <span id="balanceDisplay" class="c-green bold text-right" style="font-size: 1.5em; font-family: monospace;">$0.00</span>
            </div>
            <div class="text-sm c-muted mt-1 text-right">Session: <span id="sessionProfit">$0.00</span></div>
        </div>
    </div>

    <div class="card">
        <div class="header mb-2">⚙️ Basic Settings</div>
        <div class="flex-row mb-2">
            <div class="flex-2">
                <label>Market Pair</label>
                <select id="market" onchange="App.switchMarket()">
                    <optgroup label="Jump Indices">
                        <option value="JD10" data-digits="2">Jump 10 Index</option>
                        <option value="JD25" data-digits="2">Jump 25 Index</option>
                        <option value="JD50" data-digits="2">Jump 50 Index</option>
                        <option value="JD75" data-digits="2">Jump 75 Index</option>
                        <option value="JD100" data-digits="2" selected>Jump 100 Index</option>
                    </optgroup>
                    <optgroup label="Volatility (Standard)">
                        <option value="R_10" data-digits="3">Volatility 10</option>
                        <option value="R_25" data-digits="3">Volatility 25</option>
                        <option value="R_50" data-digits="4">Volatility 50</option>
                        <option value="R_75" data-digits="4">Volatility 75</option>
                        <option value="R_100" data-digits="2">Volatility 100</option>
                    </optgroup>
                    <optgroup label="Volatility (1s - Fast)">
                        <option value="1HZ10V" data-digits="2">Vol 10 (1s)</option>
                        <option value="1HZ25V" data-digits="2">Vol 25 (1s)</option>
                        <option value="1HZ50V" data-digits="2">Vol 50 (1s)</option>
                        <option value="1HZ75V" data-digits="2">Vol 75 (1s)</option>
                        <option value="1HZ100V" data-digits="2">Vol 100 (1s)</option>
                    </optgroup>
                </select>
            </div>
            <div class="flex-1">
                <label>Base Stake ($)</label>
                <input type="number" id="stake" value="0.35" step="0.01">
            </div>
        </div>
        <div class="flex-row">
            <div class="flex-1"><label>Ticks Min</label><input type="number" id="tickMinimum" value="50" min="10"></div>
        </div>
    </div>

    <div class="card">
        <div class="recovery-box">
            <div class="flex-between mb-2">
                <span class="bold c-muted">🔄 Smart Recovery (Manual)</span>
                <label class="switch">
                    <input type="checkbox" id="martingaleToggle" onchange="App.updateMartingaleUI()">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="mb-2">
                <label class="c-orange">Max Safety Limit ($)</label>
                <input type="number" id="martingaleMaxStake" value="50" min="1" step="1" onchange="App.updateMartingaleUI()">
            </div>
            <div class="data-row text-sm">
                <span>Status: <span id="martingaleCurrentStep" class="c-green bold">NORMAL</span></span>
                <span>Est. Payout: <span id="payoutRatioDisplay" class="c-cyan">9.6%</span></span>
            </div>
            <div class="data-row text-sm">
                <span>To recover: <span id="recoveryAmountDisplay" class="c-red">$0.00</span></span>
                <span>Next Stake: <span id="martingaleNextStake" class="c-orange">$0.35</span></span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="header mb-1">📊 Performance</div>
        <div class="stats-grid">
            <div class="stat-cell"><span id="statWins" class="stat-value c-green">0</span><span class="stat-label">Wins</span></div>
            <div class="stat-cell"><span id="statLosses" class="stat-value c-red">0</span><span class="stat-label">Loss</span></div>
            <div class="stat-cell"><span id="statWinRate" class="stat-value c-cyan">0%</span><span class="stat-label">Rate</span></div>
        </div>
    </div>

    <div class="card">
        <div id="targetBox" class="target-display mb-2">
            <div class="flex-between text-sm mb-1"><span>TARGET</span><span id="tickCounter">0 / 50</span></div>
            <div class="target-number" id="targetDigitDisplay">⏳</div>
            <div id="targetStatusMsg" class="text-sm mt-1">Collecting data...</div>
        </div>
        <div class="digit-grid" id="digitGrid"></div>
    </div>

    <div class="card">
        <button id="btnSingle" class="btn btn-green" onclick="App.placeManualTrade()">✅ Place Trade</button>
        <button id="btnStop" class="btn btn-stop" onclick="App.stopTrading()">🛑 STOP TRADING</button>
    </div>

    <div class="card">
        <div class="log-area" id="logArea"></div>
    </div>
</div>

<script>
/** * Smart Trade Bot - Auto-Reconnect & Zero-Delay Execution Edition
 */
const App = (() => {
    const APP_ID = 1089;
    let ws = null;
    let isReconnecting = false;
    
    // Core State
    const State = {
        connected: false, running: false, shouldStop: false,
        ticks: [], currentTarget: null, manualOverride: null, sessionProfit: 0,
        stats: { wins: 0, losses: 0 },
        currentDecimals: 2, 
        martingale: {
            step: 0,
            recoveryAmount: 0,
            lastPayoutRatio: 0.0964, 
            payoutSamples: []
        }
    };

    // Cached DOM Elements
    const DOM = {};
    window.addEventListener('DOMContentLoaded', () => {
        ['apiToken', 'statusText', 'loginForm', 'accountInfo', 'balanceDisplay', 'sessionProfit',
         'market', 'stake', 'tickMinimum', 'targetBox', 'tickCounter', 'targetDigitDisplay', 'targetStatusMsg', 
         'digitGrid', 'statWins', 'statLosses', 'statWinRate', 'btnSingle', 'btnStop', 'logArea',
         'martingaleToggle', 'martingaleMaxStake', 'martingaleCurrentStep', 'payoutRatioDisplay', 
         'recoveryAmountDisplay', 'martingaleNextStake'
        ].forEach(id => DOM[id] = document.getElementById(id));
        
        DOM.stake.addEventListener('input', updateMartingaleUI);
        buildDigitGrid();
    });

    function buildDigitGrid() {
        let html = '';
        for(let i=0; i<=9; i++) {
            html += `
                <div class="digit-box" id="dbox-${i}" onclick="App.setManualDigit(${i})">
                    <span class="badge badge-cold">❄️</span>
                    <span class="badge badge-hot">🔥</span>
                    <span id="emoji-${i}" class="result-emoji"></span>
                    <b style="font-size: 1.2em;">${i}</b>
                    <span id="dp-${i}" class="text-xs c-muted mt-1">0.0%</span>
                </div>`;
        }
        DOM.digitGrid.innerHTML = html;
        for(let i=0; i<=9; i++) {
            DOM[`dbox-${i}`] = document.getElementById(`dbox-${i}`);
            DOM[`dp-${i}`] = document.getElementById(`dp-${i}`);
            DOM[`emoji-${i}`] = document.getElementById(`emoji-${i}`);
        }
    }

    const log = (msg, cls="log-info") => {
        const time = new Date().toLocaleTimeString();
        DOM.logArea.insertAdjacentHTML('afterbegin', `<div class="${cls}">[${time}] ${msg}</div>`);
    };

    const updateUI = () => {
        const minTicks = parseInt(DOM.tickMinimum.value) || 50;
        const count = State.ticks.length;
        DOM.tickCounter.innerText = `${count} / ${minTicks}`;
        if(count === 0) return;

        const freq = Array(10).fill(0);
        State.ticks.forEach(t => freq[t]++);
        let arr = freq.map((c, i) => ({ digit: i, perc: (c / count) * 100 })).sort((a,b) => a.perc - b.perc);
        
        arr.forEach(item => {
            DOM[`dp-${item.digit}`].innerText = item.perc.toFixed(1) + '%';
            DOM[`dbox-${item.digit}`].classList.remove('cold-digit', 'hot-digit', 'manual-digit');
        });

        DOM[`dbox-${arr[9].digit}`].classList.add('hot-digit');
        DOM[`dbox-${arr[0].digit}`].classList.add('cold-digit');

        if(State.manualOverride !== null) {
            DOM[`dbox-${State.manualOverride}`].classList.add('manual-digit');
        } else if(count >= minTicks) {
            State.currentTarget = arr[0].digit;
            DOM.targetDigitDisplay.innerText = State.currentTarget;
            DOM.targetStatusMsg.innerText = `Auto: Coldest`;
        }
    };

    const handleTick = (price) => {
        const minTicks = parseInt(DOM.tickMinimum.value) || 50;
        
        const digit = parseInt(Number(price).toFixed(State.currentDecimals).slice(-1));
        
        State.ticks.push(digit);
        if(State.ticks.length > minTicks) State.ticks.shift();
        
        const box = DOM[`dbox-${digit}`];
        if(box) { 
            box.classList.add('active-tick'); 
            setTimeout(() => box.classList.remove('active-tick'), 150); 
        }
        
        updateUI();
    };

    // ─── MARTINGALE CALCS ───
    const getBaseStake = () => parseFloat(DOM.stake.value) || 0.35;
    
    const getCurrentStake = () => {
        if(!DOM.martingaleToggle.checked || State.martingale.step === 0) return getBaseStake();
        
        const max = parseFloat(DOM.martingaleMaxStake.value) || 50;
        const needed = State.martingale.recoveryAmount / State.martingale.lastPayoutRatio;
        
        return Math.min(Math.max(needed, getBaseStake()), max);
    };

    const updateMartingaleUI = () => {
        const isRec = State.martingale.step > 0 && DOM.martingaleToggle.checked;
        DOM.martingaleCurrentStep.innerText = isRec ? 'RECOVERING' : 'NORMAL';
        DOM.martingaleCurrentStep.className = isRec ? 'c-red bold' : 'c-green bold';
        DOM.recoveryAmountDisplay.innerText = `$${State.martingale.recoveryAmount.toFixed(2)}`;
        DOM.martingaleNextStake.innerText = `$${getCurrentStake().toFixed(2)}`;
        DOM.payoutRatioDisplay.innerText = (State.martingale.lastPayoutRatio * 100).toFixed(1) + '%';
    };

    // Keep-alive Ping to prevent API disconnects when idle
    setInterval(() => {
        if(State.connected && ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ ping: 1 }));
        }
    }, 15000); 

    const connectAPI = () => {
        const token = DOM.apiToken.value;
        if(!token) return alert("Enter Token");
        
        if(ws && ws.readyState === 1) return; // Prevent double connections

        ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
        
        ws.onopen = () => { 
            ws.send(JSON.stringify({ authorize: token })); 
            if(!isReconnecting) log("Connecting..."); 
        };

        ws.onclose = () => {
            State.connected = false;
            DOM.statusText.innerText = "Reconnecting...";
            DOM.statusText.className = "text-sm c-orange";
            isReconnecting = true;
            setTimeout(connectAPI, 3000); // Auto-reconnect loop triggers every 3 seconds if dropped
        };

        ws.onerror = () => ws.close(); // Force the close event to trigger the reconnect loop
        
        ws.onmessage = (msg) => {
            const data = JSON.parse(msg.data);
            if(data.error) return log(`Error: ${data.error.message}`, "log-loss");

            if(data.msg_type === 'authorize') {
                State.connected = true;
                DOM.loginForm.style.display = 'none';
                DOM.accountInfo.style.display = 'block';
                DOM.statusText.innerText = "Connected";
                DOM.statusText.className = "text-sm c-green";
                if(isReconnecting) log("Connection Restored!", "log-win");
                isReconnecting = false;
                
                ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
                switchMarket(); // Re-sync the market ticks after connection is established
            }

            if(data.msg_type === 'balance') DOM.balanceDisplay.innerText = `$${data.balance.balance}`;
            if(data.msg_type === 'tick') handleTick(data.tick.quote);
            
            // Subscribes to contract updates immediately upon successful direct purchase
            if(data.msg_type === 'buy') {
                ws.send(JSON.stringify({ proposal_open_contract: 1, contract_id: data.buy.contract_id, subscribe: 1 }));
            }
            
            if(data.msg_type === 'proposal_open_contract' && data.proposal_open_contract.is_sold) {
                resolveTrade(data.proposal_open_contract);
            }
        };
    };

    const resolveTrade = (contract) => {
        const profit = parseFloat(contract.profit);
        const isWin = profit > 0;
        const buyPrice = parseFloat(contract.buy_price) || 0;
        const barrier = contract.barrier;
        
        State.sessionProfit += profit;
        DOM.sessionProfit.innerText = (State.sessionProfit >= 0 ? "+$" : "-$") + Math.abs(State.sessionProfit).toFixed(2);
        DOM.sessionProfit.className = `text-sm mt-1 text-right ${State.sessionProfit >= 0 ? 'c-green' : 'c-red'}`;

        const emoji = DOM[`emoji-${barrier}`];
        if(emoji) {
            emoji.innerText = isWin ? "💰" : "😞";
            emoji.classList.add('show-emoji');
            setTimeout(() => emoji.classList.remove('show-emoji'), 2000);
        }

        isWin ? State.stats.wins++ : State.stats.losses++;
        DOM.statWins.innerText = State.stats.wins;
        DOM.statLosses.innerText = State.stats.losses;
        DOM.statWinRate.innerText = ((State.stats.wins / (State.stats.wins + State.stats.losses)) * 100).toFixed(1) + "%";
        
        log(`${isWin ? '✅ WIN' : '❌ LOSS'} ${profit > 0 ? '+' : ''}$${profit.toFixed(2)} | Digit ${barrier}`, isWin ? 'log-win' : 'log-loss');

        if(isWin && buyPrice > 0) {
            State.martingale.payoutSamples.push(profit / buyPrice);
            if(State.martingale.payoutSamples.length > 20) State.martingale.payoutSamples.shift();
            State.martingale.lastPayoutRatio = State.martingale.payoutSamples.reduce((a,b)=>a+b,0) / State.martingale.payoutSamples.length;
        }

        if(DOM.martingaleToggle.checked) {
            if(isWin) {
                if(State.martingale.step > 0) log(`Recovery Successful! Back to base stake.`, "log-win");
                State.martingale.step = 0;
                State.martingale.recoveryAmount = 0;
            } else {
                State.martingale.step++;
                State.martingale.recoveryAmount += Math.abs(profit); 
                
                const neededStake = State.martingale.recoveryAmount / State.martingale.lastPayoutRatio;
                const max = parseFloat(DOM.martingaleMaxStake.value) || 50;
                
                if(neededStake > max) {
                    log(`⚠️ Safety Limit Hit. Next stake would be $${neededStake.toFixed(2)}. Resetting to base.`, "log-loss");
                    State.martingale.step = 0;
                    State.martingale.recoveryAmount = 0;
                } else {
                    log(`Martingale active. Next stake bumped to $${neededStake.toFixed(2)} for your next trade.`, "log-warn");
                }
            }
            updateMartingaleUI();
        }

        endRunState();
    };

    const placeTrade = async (target) => {
        if(!State.connected || target === null || State.running) return;
        
        const stake = getCurrentStake().toFixed(2);
        State.running = true;
        State.shouldStop = false;
        DOM.btnSingle.disabled = true;
        DOM.btnStop.style.display = 'block';
        
        log(`Trading $${stake} on digit ${target}...`, "log-warn");
        
        // OPTIMIZATION: Direct Parameter Buy (Zero-Delay Execution)
        // Bypasses the proposal requirement entirely to eliminate latency.
        ws.send(JSON.stringify({
            buy: 1, 
            price: stake, 
            parameters: {
                amount: stake, 
                basis: 'stake', 
                contract_type: 'DIGITDIFF', 
                currency: 'USD', 
                duration: 1, 
                duration_unit: 't', 
                symbol: DOM.market.value,
                barrier: target.toString()
            }
        }));
    };

    const switchMarket = () => {
        if(!State.connected) return;
        
        const opt = DOM.market.options[DOM.market.selectedIndex];
        State.currentDecimals = parseInt(opt.getAttribute('data-digits')) || 2;

        ws.send(JSON.stringify({ forget_all: 'ticks' }));
        State.ticks = [];
        updateUI();
        ws.send(JSON.stringify({ ticks: DOM.market.value, subscribe: 1 }));
        log(`Switched to ${DOM.market.value}`);
    };

    const endRunState = () => {
        State.running = false;
        DOM.btnSingle.disabled = false;
        DOM.btnStop.style.display = 'none';
    };

    // Public API
    return {
        connectAPI, switchMarket, updateMartingaleUI,
        stopTrading: () => { State.shouldStop = true; endRunState(); log("STOPPED TRADING", "log-loss"); },
        setManualDigit: (d) => {
            State.manualOverride = d === State.manualOverride ? null : d; 
            for(let i=0; i<=9; i++) DOM[`dbox-${i}`].classList.remove('manual-digit');
            if(State.manualOverride !== null) {
                DOM[`dbox-${d}`].classList.add('manual-digit');
                DOM.targetDigitDisplay.innerText = d;
                DOM.targetStatusMsg.innerText = `Manual: ${d}`;
            } else {
                updateUI(); 
            }
        },
        placeManualTrade: () => placeTrade(State.manualOverride !== null ? State.manualOverride : State.currentTarget)
    };
})();
</script>
</body>
</html>
