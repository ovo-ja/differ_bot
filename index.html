<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trade Bot V27 (The Manager)</title>
    <style>
        :root { --bg: #0f111a; --card: #1c1f2e; --text: #fff; --sub: #8b9bb4; --blue: #3b82f6; --red: #ef4444; --green: #10b981; --orange: #f97316; --purple: #8b5cf6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 10px; }
        input, select { background: #0f111a; color: #fff; border: 1px solid #333; padding: 8px; border-radius: 4px; width: 100%; }
        label { font-size: 0.8em; color: var(--sub); display: block; margin-bottom: 3px; }
        
        /* TOGGLES */
        .switch { position: relative; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #2d3748; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .target-box { background: rgba(59, 130, 246, 0.1); border: 2px solid var(--blue); padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 10px; position: relative; }
        .target-digit { font-size: 3em; font-weight: bold; }
        
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .box { background: #2d3748; border-radius: 6px; padding: 10px 0; text-align: center; border: 2px solid transparent; transition: 0.1s; position: relative; }
        .box.safe { border-color: var(--blue); }
        .box.hot { border-color: var(--red); opacity: 0.6; }
        .box.active { background: #fff !important; color: #000; transform: scale(1.1); z-index: 10; }
        
        .btn { border: none; padding: 12px; border-radius: 8px; font-weight: bold; color: white; width: 100%; cursor: pointer; }
        .btn-green { background: var(--green); }
        .btn-stop { background: var(--red); display: none; }
        
        .log { font-family: monospace; font-size: 0.8em; height: 150px; overflow-y: auto; background: #0f111a; padding: 10px; border-radius: 6px; }
        .win { color: var(--green); } .loss { color: var(--red); } .info { color: var(--sub); }
        
        .ladder-step { font-size: 0.8em; color: var(--orange); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="row">
            <span>🔌 Status: <span id="status" style="color:var(--red)">Offline</span></span>
            <input type="password" id="token" placeholder="API Token" style="width:50%">
            <button onclick="connect()" class="btn-green" style="width:30%">Link</button>
        </div>
        <div class="row"><span>Balance: <b id="balance" style="color:var(--green)">$0.00</b></span><span>Session: <b id="profit">$0.00</b></span></div>
    </div>

    <div class="card" style="border: 1px solid var(--orange);">
        <div class="row" style="margin-bottom:0">
            <span style="font-weight:bold; color:var(--orange)">🪜 COMPOUND LADDER</span>
            <span id="ladderStatus" class="ladder-step">Step 0 / 3</span>
        </div>
        <div class="row">
            <div style="flex:1">
                <label>Ladder Steps:</label>
                <input type="number" id="ladderSteps" value="3" min="1" max="10">
            </div>
            <div style="flex:2; font-size:0.75em; color:var(--sub); line-height:1.2; padding-top:15px;">
                Profits are reinvested for X steps, then resets. Minimize exposure.
            </div>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <div style="flex:1"><label>Base Stake</label><input type="number" id="stake" value="0.35"></div>
            <div style="flex:2"><label>Market</label><select id="market" onchange="switchMarket()"><option value="R_100">Vol 100</option><option value="1HZ100V" selected>Vol 100 (1s)</option></select></div>
        </div>

        <div class="target-box" id="targetBox">
            <div style="font-size:0.8em">TARGET DIGIT</div>
            <div class="target-digit" id="dispTarget">?</div>
            <div style="font-size:0.8em; margin-top:5px" id="dispStatus">Waiting for stats...</div>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <div class="card">
        <div class="row">
            <span style="font-weight:bold; color:var(--purple)">🤖 AUTO MANAGER</span>
            <label class="switch"><input type="checkbox" id="togAuto" onchange="toggleAuto()"><span class="slider"></span></label>
        </div>
        <div class="row">
            <div style="flex:1"><label>Random Delay (s)</label><input type="text" value="2 - 6" disabled style="opacity:0.7"></div>
            <div style="flex:1"><label>Mode</label><select id="logic"><option value="entropy">Entropy (Random)</option><option value="stats">Stats (Cold)</option></select></div>
        </div>
        
        <button id="btnStop" class="btn-stop" onclick="stopAuto()">🛑 STOP AUTO</button>
        <div class="row" style="margin-top:10px">
            <button class="btn-green" onclick="manualTrade()">Place 1 Trade</button>
        </div>
    </div>

    <div class="card"><div class="log" id="log"></div></div>
</div>

<script>
    const APP_ID = 1089;
    let ws, history = [], currentTarget = null, isAuto = false, isTrading = false;
    let profit = 0, baseStake = 0.35, currentStake = 0.35;
    let ladderCount = 0; // Current step in the ladder

    // Grid
    const grid = document.getElementById('grid');
    for(let i=0; i<=9; i++) grid.innerHTML += `<div class="box" id="b${i}"><b>${i}</b><br><span id="p${i}">0%</span></div>`;

    function connect() {
        const t = document.getElementById('token').value;
        if(!t) return alert("Token Required");
        ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);
        ws.onopen = () => ws.send(JSON.stringify({authorize:t}));
        ws.onmessage = m => {
            const d = JSON.parse(m.data);
            if(d.msg_type==='authorize') {
                document.getElementById('status').innerText = "Online";
                document.getElementById('status').style.color = "#10b981";
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('accountInfo').style.display = 'block';
                baseStake = parseFloat(document.getElementById('stake').value);
                currentStake = baseStake;
                ws.send(JSON.stringify({balance:1, subscribe:1}));
                subMarket();
            }
            if(d.msg_type==='balance') document.getElementById('balance').innerText = `$${d.balance.balance}`;
            if(d.msg_type==='tick') processTick(d.tick.quote);
            if(d.msg_type==='proposal') ws.send(JSON.stringify({buy:d.proposal.id, price:d.proposal.ask_price}));
            if(d.msg_type==='proposal_open_contract' && d.proposal_open_contract.is_sold) handleResult(d.proposal_open_contract);
        };
    }

    function subMarket() {
        const m = document.getElementById('market').value;
        ws.send(JSON.stringify({ticks:m, subscribe:1}));
        history = [];
        log(`Subscribed to ${m}`, "info");
    }

    function switchMarket() {
        ws.send(JSON.stringify({forget_all:'ticks'}));
        setTimeout(subMarket, 500);
    }

    function processTick(price) {
        const digit = parseInt(price.toString().slice(-1));
        history.push(digit);
        if(history.length > 50) history.shift();

        const b = document.getElementById(`b${digit}`);
        b.classList.add('active'); setTimeout(()=>b.classList.remove('active'), 200);

        calculateTarget();

        // AUTO PILOT TRIGGER
        if(isAuto && !isTrading && currentTarget !== null) {
            startRandomTimer();
        }
    }

    function calculateTarget() {
        if(history.length < 10) return;
        
        let final = 0;
        
        if(document.getElementById('logic').value === 'entropy') {
            // ENTROPY: Pick random from last 20
            const pool = history.slice(-20);
            if(pool.length > 0) final = pool[Math.floor(Math.random() * pool.length)];
            else final = Math.floor(Math.random() * 10);
            document.getElementById('dispStatus').innerText = "Entropy Random";
        } else {
            // STATS: Coldest
            const counts = {}; history.forEach(x => counts[x] = (counts[x]||0)+1);
            let minP = 100;
            for(let i=0; i<=9; i++) {
                const p = (counts[i]||0)/history.length*100;
                document.getElementById(`p${i}`).innerText = p.toFixed(0)+"%";
                if(p < minP) { minP = p; final = i; }
            }
            document.getElementById('dispStatus').innerText = `Coldest: ${minP.toFixed(0)}%`;
        }

        currentTarget = final;
        document.getElementById('dispTarget').innerText = final;
        
        // Visuals
        for(let i=0; i<=9; i++) document.getElementById(`b${i}`).className = "box";
        document.getElementById(`b${final}`).classList.add('safe');
    }

    let timerRunning = false;
    function startRandomTimer() {
        if(timerRunning) return;
        timerRunning = true;
        
        // RANDOM DELAY: 2 to 6 seconds
        const delay = Math.floor(Math.random() * 4000) + 2000;
        
        setTimeout(() => {
            if(isAuto && !isTrading) placeTrade();
            timerRunning = false;
        }, delay);
    }

    function manualTrade() {
        if(!currentTarget) return alert("Wait for data");
        placeTrade(true);
    }

    function placeTrade(manual = false) {
        isTrading = true;
        
        // If Manual, reset everything
        if(manual) {
            currentStake = parseFloat(document.getElementById('stake').value);
            ladderCount = 0;
            updateLadderUI();
        }

        const m = document.getElementById('market').value;
        ws.send(JSON.stringify({
            proposal: 1, amount: currentStake, barrier: currentTarget, basis: 'stake',
            contract_type: 'DIGITDIFF', currency: 'USD', duration: 1, duration_unit: 't', symbol: m
        }));
        
        log(`🚀 Fired on ${currentTarget} ($${currentStake})`, "info");
    }

    function handleResult(c) {
        const p = parseFloat(c.profit);
        profit += p;
        document.getElementById('profit').innerText = `$${profit.toFixed(2)}`;
        document.getElementById('profit').style.color = profit>=0 ? "#10b981" : "#ef4444";

        if(p > 0) {
            log(`WIN +$${p}`, "win");
            processLadder(p); // Handle compounding
        } else {
            log(`LOSS $${p}`, "loss");
            resetLadder(); // Loss resets ladder
        }
        
        isTrading = false;
    }

    function processLadder(winAmount) {
        const maxSteps = parseInt(document.getElementById('ladderSteps').value);
        ladderCount++;
        
        if(ladderCount >= maxSteps) {
            // Ladder Complete! Reset to base.
            log(`🎉 Ladder Complete! Banked. Resetting.`, "win");
            resetLadder();
        } else {
            // Continue Ladder: Reinvest Stake + Profit
            // Differs profit is usually Stake * 0.099. 
            // New Stake = Old Stake + Profit
            currentStake = (parseFloat(currentStake) + parseFloat(winAmount)).toFixed(2);
            log(`🪜 Step ${ladderCount}/${maxSteps}: Compounding to $${currentStake}`, "info");
            updateLadderUI();
        }
    }

    function resetLadder() {
        ladderCount = 0;
        baseStake = parseFloat(document.getElementById('stake').value);
        currentStake = baseStake;
        updateLadderUI();
    }

    function updateLadderUI() {
        const max = document.getElementById('ladderSteps').value;
        document.getElementById('ladderStatus').innerText = `Step ${ladderCount} / ${max}`;
    }

    function toggleAuto() {
        isAuto = document.getElementById('togAuto').checked;
        if(isAuto) {
            document.getElementById('btnStop').style.display = 'block';
            resetLadder(); // Always start fresh
            log("🤖 Auto-Pilot Started (Random Delays Active)", "info");
        } else {
            stopAuto();
        }
    }

    function stopAuto() {
        isAuto = false;
        document.getElementById('togAuto').checked = false;
        document.getElementById('btnStop').style.display = 'none';
        log("🛑 Auto-Pilot Stopped", "warn");
    }

    function log(m, c) {
        const d = new Date().toLocaleTimeString();
        document.getElementById('log').innerHTML = `<div class="${c}">[${d}] ${m}</div>` + document.getElementById('log').innerHTML;
    }
</script>
</body>
</html>
