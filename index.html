<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Trade Bot V47</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c14;
            --bg-card: #12151f;
            --bg-card-alt: #161a28;
            --bg-input: #0d0f18;
            --border: #1e2336;
            --border-hover: #2a3050;
            --text-primary: #e8ecf4;
            --text-secondary: #5a6580;
            --text-muted: #3d4660;
            --accent-blue: #4a8eff;
            --accent-blue-dim: rgba(74, 142, 255, 0.12);
            --accent-red: #ff4d6a;
            --accent-red-dim: rgba(255, 77, 106, 0.1);
            --accent-green: #2dd4a0;
            --accent-green-dim: rgba(45, 212, 160, 0.1);
            --accent-orange: #ff9f43;
            --accent-orange-dim: rgba(255, 159, 67, 0.1);
            --accent-purple: #a78bfa;
            --accent-purple-dim: rgba(167, 139, 250, 0.1);
            --accent-cyan: #22d3ee;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 2px 12px rgba(0,0,0,0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(74, 142, 255, 0.04) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(167, 139, 250, 0.03) 0%, transparent 60%);
        }

        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 14px; padding-bottom: 40px; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 0.85em;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        /* INPUTS */
        input[type="number"], input[type="password"], select {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            width: 100%;
            font-size: 0.85em;
            transition: border-color 0.2s;
            outline: none;
        }
        input:focus, select:focus { border-color: var(--accent-blue); }
        label { font-size: 0.72em; color: var(--text-secondary); margin-bottom: 4px; display: block; font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }

        /* TOGGLE SWITCH */
        .switch { position: relative; display: inline-block; width: 44px; height: 22px; flex-shrink: 0; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background: var(--border); transition: .3s; border-radius: 22px; }
        .slider::before { content: ""; position: absolute; height: 16px; width: 16px; left: 3px; bottom: 3px; background: var(--text-secondary); transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: var(--accent-green); }
        input:checked + .slider::before { transform: translateX(22px); background: white; }

        /* BUTTONS */
        .btn {
            font-family: 'Outfit', sans-serif;
            border: none;
            padding: 11px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.82em;
            color: white;
            cursor: pointer;
            width: 100%;
            margin-bottom: 6px;
            letter-spacing: 0.03em;
            transition: opacity 0.15s, transform 0.1s;
            text-transform: uppercase;
        }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .btn-connect { background: var(--accent-blue); }
        .btn-green { background: var(--accent-green); color: #0a0c14; }
        .btn-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .btn-stop { background: var(--accent-red); display: none; }
        .btn-mini { padding: 5px 10px; font-size: 0.68em; margin: 0; width: auto; background: var(--bg-input); border: 1px solid var(--border); border-radius: 4px; }
        .btn-mini:hover { border-color: var(--accent-purple); color: var(--accent-purple); }

        /* BALANCE */
        .balance-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.4em;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* SECTIONS */
        .section-wrap {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .section-recovery {
            background: var(--accent-red-dim);
            border: 1px solid rgba(255, 77, 106, 0.2);
        }
        .section-autopilot {
            background: var(--accent-green-dim);
            border: 1px solid rgba(45, 212, 160, 0.2);
        }
        .section-entropy {
            background: var(--accent-purple-dim);
            border: 1px solid rgba(167, 139, 250, 0.15);
            padding: 8px 12px;
            margin-bottom: 8px;
        }
        .section-limits {
            background: var(--accent-orange-dim);
            border: 1px solid rgba(255, 159, 67, 0.2);
        }

        /* TARGET BOX */
        .target-display {
            background: var(--accent-blue-dim);
            border: 2px solid var(--accent-blue);
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 12px;
            transition: all 0.4s ease;
        }
        .target-top-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.78em; font-weight: 600; }
        .tick-badge { background: rgba(0,0,0,0.3); padding: 3px 10px; border-radius: 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.9em; }
        .target-number-container { height: 56px; position: relative; margin: 4px 0; }
        .target-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.6em;
            font-weight: 700;
            display: block;
            width: 100%;
            position: absolute;
            top: 0; left: 0;
            transition: transform 0.35s, opacity 0.35s;
        }
        .slide-in { transform: translateY(0); opacity: 1; }
        .slide-out-up { transform: translateY(-25px); opacity: 0; }
        .slide-in-up { transform: translateY(25px); opacity: 0; }
        #targetStatusMsg { font-size: 0.78em; color: var(--text-secondary); }
        #countdownOverlay { font-family: 'JetBrains Mono', monospace; font-size: 0.82em; color: var(--accent-orange); font-weight: 700; margin-top: 6px; display: none; }

        /* DIGIT GRID */
        .digit-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .digit-box {
            background: var(--bg-card-alt);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 8px 4px;
            text-align: center;
            font-size: 0.88em;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 62px;
            transition: all 0.15s;
        }
        .digit-box:hover { border-color: var(--border-hover); background: #1a1e2e; }
        .digit-box b { font-family: 'JetBrains Mono', monospace; font-size: 1.1em; }
        .digit-pct { font-family: 'JetBrains Mono', monospace; font-size: 0.7em; color: var(--text-secondary); margin-top: 2px; }

        .cold-digit { background: var(--accent-blue-dim); border-color: var(--accent-blue); }
        .second-cold-digit { background: var(--accent-orange-dim); border-color: var(--accent-orange); }
        .manual-digit { background: var(--accent-purple-dim) !important; border-color: var(--accent-purple) !important; }
        .random-digit { background: var(--accent-purple-dim); border-color: var(--accent-purple); box-shadow: 0 0 12px rgba(167, 139, 250, 0.2); }
        .active-tick { background: #ffffff !important; color: #000 !important; border-color: #fff !important; transform: scale(1.08); z-index: 10; }
        .active-tick .digit-pct { color: #333 !important; }

        /* BADGES */
        .badge { font-family: 'JetBrains Mono', monospace; font-size: 0.55em; padding: 1px 5px; border-radius: 3px; position: absolute; top: -4px; right: -4px; font-weight: 700; display: none; z-index: 5; letter-spacing: 0.02em; }
        .cold-digit .badge-cold { display: block; background: var(--accent-blue); color: white; }
        .second-cold-digit .badge-safe { display: block; background: var(--accent-orange); color: white; }
        .random-digit .badge-rnd { display: block; background: var(--accent-purple); color: white; }

        /* RESULT EMOJI */
        .result-emoji { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 1.8em; opacity: 0; pointer-events: none; transition: all 0.5s ease-out; z-index: 20; }
        .show-emoji { opacity: 1; transform: translate(-50%, -80%); }

        /* SEQUENCE */
        .sequence-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; background: var(--bg-input); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        .sequence-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; margin-bottom: 10px; max-height: 200px; overflow-y: auto; }
        .seq-step { background: var(--bg-input); padding: 6px; border-radius: 6px; text-align: center; border: 1px solid var(--border); }
        .seq-step label { color: var(--accent-purple); font-size: 0.65em; margin-bottom: 2px; }
        .seq-select { padding: 4px; font-size: 0.72em; margin-bottom: 0; border-color: var(--border); }

        /* PROGRESS BAR */
        .progress-container { height: 22px; background: var(--bg-input); margin-top: 10px; border-radius: 11px; overflow: hidden; position: relative; display: none; border: 1px solid var(--border); }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8b5cf6, #6d28d9); transition: width 0.3s; }
        .progress-text { position: absolute; inset: 0; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 0.72em; font-weight: 600; line-height: 22px; text-shadow: 1px 1px 2px rgba(0,0,0,0.9); z-index: 2; }

        /* LOG */
        .log-area {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72em;
            line-height: 1.6;
            height: 200px;
            overflow-y: auto;
            background: var(--bg-input);
            padding: 10px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .log-area::-webkit-scrollbar { width: 4px; }
        .log-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        .log-win { color: var(--accent-green); }
        .log-loss { color: var(--accent-red); }
        .log-info { color: var(--text-secondary); }
        .log-warn { color: var(--accent-orange); }

        /* STATS ROW */
        .stats-row { display: flex; gap: 8px; margin-top: 8px; }
        .stat-chip {
            flex: 1;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px;
            text-align: center;
        }
        .stat-chip .stat-label { font-size: 0.65em; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
        .stat-chip .stat-value { font-family: 'JetBrains Mono', monospace; font-size: 0.95em; font-weight: 700; margin-top: 2px; }

        .hint-text { text-align: center; font-size: 0.7em; color: var(--text-muted); margin-top: 6px; }

        /* STATE INDICATOR */
        .state-pill {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65em;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            letter-spacing: 0.04em;
        }
        .state-idle { background: var(--border); color: var(--text-secondary); }
        .state-collecting { background: var(--accent-orange-dim); color: var(--accent-orange); border: 1px solid rgba(255,159,67,0.3); }
        .state-ready { background: var(--accent-green-dim); color: var(--accent-green); border: 1px solid rgba(45,212,160,0.3); }
        .state-trading { background: var(--accent-blue-dim); color: var(--accent-blue); border: 1px solid rgba(74,142,255,0.3); animation: pulse 1.5s infinite; }
        .state-recovery { background: var(--accent-red-dim); color: var(--accent-red); border: 1px solid rgba(255,77,106,0.3); animation: pulse 1s infinite; }
        .state-paused { background: var(--accent-orange-dim); color: var(--accent-orange); border: 1px solid rgba(255,159,67,0.3); }

        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* Responsive tweak */
        @media (max-width: 400px) {
            .digit-grid { gap: 5px; }
            .digit-box { min-height: 55px; padding: 6px 2px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- CONNECTION -->
    <div class="card">
        <div class="card-header">
            <span>Connection</span>
            <div style="display:flex; align-items:center; gap:8px;">
                <span id="statePill" class="state-pill state-idle">IDLE</span>
                <span id="statusDot" style="width:8px;height:8px;border-radius:50%;background:var(--accent-red);"></span>
            </div>
        </div>
        <div id="loginForm">
            <input type="password" id="apiToken" placeholder="Paste Deriv API Token">
            <button class="btn btn-connect" onclick="connectAPI()">Connect Account</button>
        </div>
        <div id="accountInfo" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="color:var(--text-secondary); font-size:0.8em;">Balance</span>
                <span id="balanceDisplay" class="balance-box">$0.00</span>
            </div>
            <div class="stats-row">
                <div class="stat-chip">
                    <div class="stat-label">Session P/L</div>
                    <div class="stat-value" id="sessionProfit" style="color:var(--text-secondary);">$0.00</div>
                </div>
                <div class="stat-chip">
                    <div class="stat-label">Win Rate</div>
                    <div class="stat-value" id="winRateDisplay" style="color:var(--text-secondary);">—</div>
                </div>
                <div class="stat-chip">
                    <div class="stat-label">Trades</div>
                    <div class="stat-value" id="tradeCountDisplay" style="color:var(--text-secondary);">0</div>
                </div>
            </div>
        </div>
    </div>

    <!-- RECOVERY + LIMITS -->
    <div class="card">
        <div class="card-header">Risk Management</div>

        <div class="section-wrap section-recovery" style="margin-bottom:10px;">
            <div style="font-weight:600; font-size:0.8em; color:var(--accent-red); margin-bottom:8px;">🛡️ ONE-SHOT RECOVERY</div>
            <div style="display:flex; gap:10px;">
                <div style="flex:1">
                    <label>Multiplier (×)</label>
                    <input type="number" id="martingale" value="11" step="0.5" style="border-color:rgba(255,77,106,0.3);">
                </div>
                <div style="flex:1">
                    <label>Max Attempts</label>
                    <input type="number" id="martingaleLimit" value="1" min="0" max="5">
                </div>
            </div>
            <div style="margin-top:8px;">
                <label>Pause on Loss (sec)</label>
                <input type="number" id="lossPause" value="30" style="border-color:rgba(255,159,67,0.3);">
            </div>
        </div>

        <div class="section-wrap section-limits">
            <div style="font-weight:600; font-size:0.8em; color:var(--accent-orange); margin-bottom:8px;">📊 SESSION LIMITS</div>
            <div style="display:flex; gap:10px;">
                <div style="flex:1">
                    <label>Take Profit ($)</label>
                    <input type="number" id="takeProfit" value="10" step="0.5" style="border-color:rgba(45,212,160,0.3);">
                </div>
                <div style="flex:1">
                    <label>Stop Loss ($)</label>
                    <input type="number" id="stopLoss" value="5" step="0.5" style="border-color:rgba(255,77,106,0.3);">
                </div>
            </div>
            <div style="display:flex; gap:10px; margin-top:8px;">
                <div style="flex:1">
                    <label>Max Trades (0=∞)</label>
                    <input type="number" id="maxTrades" value="0" min="0">
                </div>
                <div style="flex:1; display:flex; align-items:flex-end;">
                    <button class="btn btn-mini" onclick="resetSession()" style="width:100%; padding:10px;">↻ Reset Session</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS -->
    <div class="card">
        <div class="card-header">Settings</div>
        <div style="display:flex; gap:10px; margin-bottom:8px;">
            <div style="flex:2;">
                <label>Market Pair</label>
                <select id="market" onchange="switchMarket()">
                    <optgroup label="Volatility (1s)">
                        <option value="1HZ10V">Vol 10 (1s)</option>
                        <option value="1HZ25V">Vol 25 (1s)</option>
                        <option value="1HZ50V">Vol 50 (1s)</option>
                        <option value="1HZ75V">Vol 75 (1s)</option>
                        <option value="1HZ100V" selected>Vol 100 (1s)</option>
                    </optgroup>
                    <optgroup label="Volatility (Standard)">
                        <option value="R_10">Vol 10</option>
                        <option value="R_25">Vol 25</option>
                        <option value="R_50">Vol 50</option>
                        <option value="R_75">Vol 75</option>
                        <option value="R_100">Vol 100</option>
                    </optgroup>
                    <optgroup label="Jump Indices">
                        <option value="JD10">Jump 10</option>
                        <option value="JD25">Jump 25</option>
                        <option value="JD50">Jump 50</option>
                        <option value="JD75">Jump 75</option>
                        <option value="JD100">Jump 100</option>
                    </optgroup>
                </select>
            </div>
            <div style="flex:1;">
                <label>Stake ($)</label>
                <input type="number" id="stake" value="0.35" step="0.01" onchange="updateBaseStake()">
            </div>
        </div>
        <div>
            <label>Tick Analysis Window</label>
            <input type="number" id="tickMinimum" value="50" min="10" onchange="enforceMinimum()">
        </div>
    </div>

    <!-- TARGET + GRID -->
    <div class="card">
        <div class="section-wrap section-autopilot">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <span id="controlModeText" style="font-weight:600; font-size:0.85em; color:var(--text-secondary);">✋ MANUAL</span>
                <label class="switch">
                    <input type="checkbox" id="autoPilotToggle" onchange="toggleAutoPilot()">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="section-wrap section-entropy" style="margin-bottom:8px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-weight:600; font-size:0.8em; color:var(--accent-purple);">🎲 Entropy (Random)</span>
                    <label class="switch" style="transform:scale(0.85);">
                        <input type="checkbox" id="entropyToggle" onchange="toggleEntropy()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div style="display:flex; gap:10px;">
                <div style="flex:1">
                    <label style="color:var(--accent-red);">Max Limit (%)</label>
                    <input type="number" id="threshold" value="9" style="margin:0; border-color:rgba(255,77,106,0.3);">
                </div>
                <div style="flex:1">
                    <label style="color:var(--accent-orange);">Safe Floor (%)</label>
                    <input type="number" id="safeFloor" value="2" style="margin:0; border-color:rgba(255,159,67,0.3);">
                </div>
            </div>
        </div>

        <div id="targetBox" class="target-display">
            <div class="target-top-row">
                <span>TARGET DIGIT</span>
                <span id="tickCounter" class="tick-badge">0 / 50</span>
            </div>
            <div class="target-number-container">
                <span id="targetDigitDisplay" class="target-number slide-in">⏳</span>
            </div>
            <span id="targetStatusMsg">Collecting data...</span>
            <div id="countdownOverlay">⏳ <span id="countdownLabel">WAIT</span>: <span id="countdownTimer">0</span>s</div>
        </div>

        <div class="digit-grid" id="digitGrid"></div>
        <div class="hint-text">Tap a digit to override target</div>
    </div>

    <!-- SEQUENCE BUILDER -->
    <div class="card">
        <div class="card-header">Sequence Builder</div>

        <div class="sequence-controls">
            <div style="flex:1;">
                <label style="color:var(--accent-purple);">Total Trades</label>
                <input type="number" id="seqLength" value="3" min="1" max="100" onchange="updateSequenceUI()" style="margin:0; border-color:rgba(167,139,250,0.3);">
            </div>
            <div style="flex:1; display:flex; gap:5px; align-items:flex-end;">
                <button class="btn btn-mini" onclick="setAllDelays('0')">⚡ Instant</button>
                <button class="btn btn-mini" onclick="setAllDelays('random')">🎲 Random</button>
            </div>
        </div>

        <div id="sequenceContainer" class="sequence-grid"></div>

        <button id="btnStartCustom" class="btn btn-purple" onclick="runCustomSequence()">⚡ Run Sequence</button>
        <button id="btnSingle" class="btn btn-green" onclick="placeSingleManualTrade()">✅ Single Trade</button>
        <button id="btnStop" class="btn btn-stop" onclick="stopTrading()">🛑 Stop All</button>

        <div id="loadingBar" class="progress-container">
            <div id="progressFill" class="progress-fill"></div>
            <div id="progressText" class="progress-text">Ready</div>
        </div>
    </div>

    <!-- LOG -->
    <div class="card">
        <div class="card-header">
            <span>Activity Log</span>
            <button class="btn btn-mini" onclick="clearLog()">Clear</button>
        </div>
        <div class="log-area" id="logArea"></div>
    </div>
</div>

<script>
// ─────────────────────────────────────────────
//  SMART TRADE BOT V47 — Refactored & Hardened
// ─────────────────────────────────────────────

const APP_ID = 1089;

// ── State Machine ──
const State = Object.freeze({
    DISCONNECTED: 'DISCONNECTED',
    IDLE: 'IDLE',
    COLLECTING: 'COLLECTING',
    READY: 'READY',
    TRADING: 'TRADING',
    RECOVERY: 'RECOVERY',
    PAUSED: 'PAUSED',
});

let botState = State.DISCONNECTED;

function setState(newState) {
    botState = newState;
    const pill = document.getElementById('statePill');
    const map = {
        DISCONNECTED: ['OFFLINE', 'state-idle'],
        IDLE: ['IDLE', 'state-idle'],
        COLLECTING: ['COLLECTING', 'state-collecting'],
        READY: ['READY', 'state-ready'],
        TRADING: ['TRADING', 'state-trading'],
        RECOVERY: ['RECOVERY', 'state-recovery'],
        PAUSED: ['PAUSED', 'state-paused'],
    };
    const [label, cls] = map[newState] || ['IDLE', 'state-idle'];
    pill.className = 'state-pill ' + cls;
    pill.textContent = label;
}

// ── Core Variables ──
let ws;
let tickHistory = [];
let currentTargetDigit = null;
let currentMinPerc = 100;
let manualOverrideDigit = null;
let isAutoPilot = false;
let isEntropyMode = false;
let isConnected = false;
let displayedPercentages = new Array(10).fill(0);

// ── Trade State ──
let baseStake = 0.35;
let currentStake = 0.35;
let martingaleStep = 0;
let tradeResolver = null;
let tradeTimeout = null;
let isPaused = false;
let isRunning = false;
let shouldStop = false;

// ── Session Stats ──
let sessionProfit = 0;
let sessionWins = 0;
let sessionLosses = 0;

// ── Init ──
window.onload = function () {
    buildDigitGrid();
    updateSequenceUI();
    setState(State.DISCONNECTED);
};

// ── Digit Grid Builder ──
function buildDigitGrid() {
    const grid = document.getElementById('digitGrid');
    grid.innerHTML = '';
    for (let i = 0; i <= 9; i++) {
        grid.innerHTML += `
            <div class="digit-box" id="dbox-${i}" onclick="selectManualDigit(${i})">
                <span class="badge badge-cold">COLD</span>
                <span class="badge badge-safe">SAFE</span>
                <span class="badge badge-rnd">RND</span>
                <span id="emoji-${i}" class="result-emoji"></span>
                <b>${i}</b>
                <span id="dp-${i}" class="digit-pct">0.0%</span>
            </div>`;
    }
}

// ── Sequence UI ──
function updateSequenceUI() {
    const length = clamp(parseInt(document.getElementById('seqLength').value) || 1, 1, 100);
    const container = document.getElementById('sequenceContainer');
    const existing = Array.from(container.querySelectorAll('select')).map(s => s.value);
    container.innerHTML = '';
    for (let i = 0; i < length; i++) {
        const def = i < existing.length ? existing[i] : 'random';
        container.insertAdjacentHTML('beforeend', `
            <div class="seq-step">
                <label>Trade ${i + 1}</label>
                <select class="seq-select" id="seq-delay-${i}">
                    <option value="0" ${def === '0' ? 'selected' : ''}>Instant</option>
                    <option value="random" ${def === 'random' ? 'selected' : ''}>Rnd 2-6s</option>
                    <option value="60" ${def === '60' ? 'selected' : ''}>1 min</option>
                    <option value="120" ${def === '120' ? 'selected' : ''}>2 min</option>
                </select>
            </div>`);
    }
}

function setAllDelays(val) {
    const length = clamp(parseInt(document.getElementById('seqLength').value) || 1, 1, 100);
    for (let i = 0; i < length; i++) {
        const el = document.getElementById(`seq-delay-${i}`);
        if (el) el.value = val;
    }
}

// ── Connection ──
function connectAPI() {
    const token = document.getElementById('apiToken').value.trim();
    if (!token) return alert('Enter your API token');

    ws = new WebSocket(`wss://ws.binaryws.com/websockets/v3?app_id=${APP_ID}`);

    ws.onopen = () => {
        ws.send(JSON.stringify({ authorize: token }));
        log('Connecting...', 'log-info');
    };

    ws.onclose = () => {
        isConnected = false;
        setState(State.DISCONNECTED);
        document.getElementById('statusDot').style.background = 'var(--accent-red)';
        log('⚠️ Connection closed', 'log-loss');
    };

    ws.onerror = () => {
        log('⚠️ WebSocket error', 'log-loss');
    };

    ws.onmessage = (msg) => {
        const data = JSON.parse(msg.data);
        if (data.error) {
            log(`⚠️ ${data.error.message}`, 'log-loss');
            return;
        }
        handleMessage(data);
    };
}

function handleMessage(data) {
    switch (data.msg_type) {
        case 'authorize':
            isConnected = true;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('accountInfo').style.display = 'block';
            document.getElementById('statusDot').style.background = 'var(--accent-green)';
            baseStake = parseFloat(document.getElementById('stake').value);
            currentStake = baseStake;
            ws.send(JSON.stringify({ balance: 1, subscribe: 1 }));
            ws.send(JSON.stringify({ ticks: document.getElementById('market').value, subscribe: 1 }));
            setState(State.COLLECTING);
            log('✅ Connected', 'log-win');
            break;

        case 'balance':
            document.getElementById('balanceDisplay').innerText =
                data.balance.currency + ' ' + parseFloat(data.balance.balance).toFixed(2);
            break;

        case 'tick':
            updateStats(data.tick.quote);
            break;

        case 'proposal':
            ws.send(JSON.stringify({ buy: data.proposal.id, price: data.proposal.ask_price }));
            break;

        case 'buy':
            log(`✅ Executed @ $${Number(currentStake).toFixed(2)}`, 'log-info');
            ws.send(JSON.stringify({
                proposal_open_contract: 1,
                contract_id: data.buy.contract_id,
                subscribe: 1,
            }));
            break;

        case 'proposal_open_contract':
            if (data.proposal_open_contract.is_sold) {
                handleContractResult(data.proposal_open_contract);
            }
            break;
    }
}

// ── Contract Result Handler ──
function handleContractResult(contract) {
    const profit = parseFloat(contract.profit);
    const barrier = parseInt(contract.barrier);

    sessionProfit += profit;
    if (profit > 0) sessionWins++;
    else sessionLosses++;

    updateSessionUI();

    // Show emoji
    const emojiEl = document.getElementById(`emoji-${barrier}`);
    if (emojiEl) {
        emojiEl.innerText = profit > 0 ? '💰' : '💔';
        emojiEl.classList.add('show-emoji');
        setTimeout(() => emojiEl.classList.remove('show-emoji'), 2500);
    }

    if (profit > 0) {
        log(`WIN +$${profit.toFixed(2)}`, 'log-win');
        resetStake();
    } else {
        log(`LOSS -$${Math.abs(profit).toFixed(2)}`, 'log-loss');
        triggerSafetyProtocol();
    }

    // Check session limits
    if (checkSessionLimits()) {
        shouldStop = true;
        if (isAutoPilot) {
            document.getElementById('autoPilotToggle').checked = false;
            toggleAutoPilot();
        }
    }

    // Resolve pending trade promise
    resolveCurrentTrade();
}

function resolveCurrentTrade() {
    if (tradeTimeout) { clearTimeout(tradeTimeout); tradeTimeout = null; }
    if (tradeResolver) { const r = tradeResolver; tradeResolver = null; r(); }
}

// ── Session Stats UI ──
function updateSessionUI() {
    const profitEl = document.getElementById('sessionProfit');
    profitEl.innerText = (sessionProfit >= 0 ? '+$' : '-$') + Math.abs(sessionProfit).toFixed(2);
    profitEl.style.color = sessionProfit >= 0 ? 'var(--accent-green)' : 'var(--accent-red)';

    const total = sessionWins + sessionLosses;
    const wrEl = document.getElementById('winRateDisplay');
    wrEl.innerText = total > 0 ? ((sessionWins / total) * 100).toFixed(1) + '%' : '—';
    wrEl.style.color = total > 0 ? (sessionWins / total >= 0.5 ? 'var(--accent-green)' : 'var(--accent-red)') : 'var(--text-secondary)';

    document.getElementById('tradeCountDisplay').innerText = total;
    document.getElementById('tradeCountDisplay').style.color = 'var(--text-primary)';
}

function resetSession() {
    sessionProfit = 0;
    sessionWins = 0;
    sessionLosses = 0;
    updateSessionUI();
    log('↻ Session stats reset', 'log-info');
}

// ── Session Limits ──
function checkSessionLimits() {
    const tp = parseFloat(document.getElementById('takeProfit').value);
    const sl = parseFloat(document.getElementById('stopLoss').value);
    const maxTrades = parseInt(document.getElementById('maxTrades').value);
    const total = sessionWins + sessionLosses;

    if (tp > 0 && sessionProfit >= tp) {
        log(`🎯 TAKE PROFIT reached (+$${sessionProfit.toFixed(2)})! Stopping.`, 'log-win');
        return true;
    }
    if (sl > 0 && sessionProfit <= -sl) {
        log(`🛑 STOP LOSS hit (-$${Math.abs(sessionProfit).toFixed(2)})! Stopping.`, 'log-loss');
        return true;
    }
    if (maxTrades > 0 && total >= maxTrades) {
        log(`📊 Max trades (${maxTrades}) reached. Stopping.`, 'log-warn');
        return true;
    }
    return false;
}

// ── Stake Management ──
function resetStake() {
    martingaleStep = 0;
    baseStake = parseFloat(document.getElementById('stake').value);
    currentStake = baseStake;
    if (botState === State.RECOVERY) setState(State.TRADING);
}

function updateBaseStake() {
    baseStake = parseFloat(document.getElementById('stake').value);
    if (martingaleStep === 0) currentStake = baseStake;
}

function triggerSafetyProtocol() {
    const pauseTime = parseInt(document.getElementById('lossPause').value);
    const mult = parseFloat(document.getElementById('martingale').value);
    const limit = parseInt(document.getElementById('martingaleLimit').value);

    if (martingaleStep < limit) {
        martingaleStep++;
        currentStake = Number((parseFloat(currentStake) * mult).toFixed(2)); // FIX: keep as number
        setState(State.RECOVERY);
        log(`🛡️ RECOVERY ${martingaleStep}/${limit} — Stake: $${currentStake.toFixed(2)}`, 'log-warn');
    } else {
        log(`❌ Recovery limit reached. Resetting to base.`, 'log-loss');
        resetStake();
    }

    if (pauseTime > 0) {
        isPaused = true;
        setState(State.PAUSED);
        document.getElementById('countdownOverlay').style.display = 'block';
        document.getElementById('countdownLabel').innerText = 'PAUSED';
        let timeLeft = pauseTime;
        const timer = setInterval(() => {
            timeLeft--;
            document.getElementById('countdownTimer').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                isPaused = false;
                document.getElementById('countdownOverlay').style.display = 'none';
                if (martingaleStep > 0) setState(State.RECOVERY);
                else setState(isRunning ? State.TRADING : State.READY);
                log('🟢 Pause ended', 'log-info');
            }
        }, 1000);
        log(`⏸️ Pausing ${pauseTime}s...`, 'log-warn');
    }
}

// ── Market ──
function switchMarket() {
    if (!isConnected) return;
    if (isRunning) { log('⚠️ Cannot switch market while trading!', 'log-loss'); return; } // FIX: guard
    ws.send(JSON.stringify({ forget_all: 'ticks' }));
    log('🔄 Switching market...', 'log-info');
    resetData();
    setState(State.COLLECTING);
    setTimeout(() => {
        const market = document.getElementById('market').value;
        ws.send(JSON.stringify({ ticks: market, subscribe: 1 }));
        log(`✅ Subscribed to ${market}`, 'log-win');
    }, 300);
}

// ── Mode Toggles ──
function toggleEntropy() {
    isEntropyMode = document.getElementById('entropyToggle').checked;
    log(isEntropyMode ? '🎲 Entropy: ON' : '📊 Entropy: OFF', 'log-info');
    if (tickHistory.length > 0) updateUI(tickHistory.length, parseInt(document.getElementById('tickMinimum').value));
}

function toggleAutoPilot() {
    isAutoPilot = document.getElementById('autoPilotToggle').checked;
    const statusText = document.getElementById('controlModeText');
    if (isAutoPilot) {
        manualOverrideDigit = null;
        document.querySelectorAll('.manual-digit').forEach(el => el.classList.remove('manual-digit'));
        document.getElementById('btnStartCustom').disabled = true;
        document.getElementById('btnSingle').disabled = true;
        statusText.innerText = '🤖 AUTO';
        statusText.style.color = 'var(--accent-green)';
        resetStake();
        log('🤖 Auto-Pilot ARMED', 'log-win');
        startAutoPilotWatch();
    } else {
        document.getElementById('btnStartCustom').disabled = false;
        document.getElementById('btnSingle').disabled = false;
        statusText.innerText = '✋ MANUAL';
        statusText.style.color = 'var(--text-secondary)';
        shouldStop = true;
        log('🤖 Auto-Pilot OFF', 'log-loss');
    }
}

async function startAutoPilotWatch() {
    shouldStop = false;
    while (isAutoPilot && !shouldStop) {
        if (currentTargetDigit === null) { await sleep(1000); continue; }
        const maxThreshold = parseFloat(document.getElementById('threshold').value);

        if (currentMinPerc <= maxThreshold && !isPaused && !isRunning) {
            log(`🎯 Trigger: Digit ${currentTargetDigit} @ ${currentMinPerc.toFixed(1)}%`, 'log-win');
            const delay = randInt(2000, 6000);
            showCountdown('RND DELAY', delay / 1000);
            await sleep(delay);
            hideCountdown();

            if (!shouldStop && !isPaused) await runCustomSequence(true);
        }
        await sleep(2000);
    }
}

// ── Manual Digit Select ──
function selectManualDigit(digit) {
    if (isAutoPilot) return log('⚠️ Disable auto-pilot first', 'log-warn');
    manualOverrideDigit = digit;
    document.querySelectorAll('.manual-digit').forEach(el => el.classList.remove('manual-digit'));
    document.getElementById(`dbox-${digit}`).classList.add('manual-digit');
    updateTargetBoxVisuals(digit, true);
    log(`🎯 Manual target: ${digit}`, 'log-warn');
}

// ── Tick Processing ──
function updateStats(price) {
    const min = parseInt(document.getElementById('tickMinimum').value) || 50;
    const select = document.getElementById('market');
    const decimals = parseInt(select.options[select.selectedIndex].getAttribute('data-digits')) || 2;
    const digit = parseInt(Number(price).toFixed(decimals).slice(-1));
    tickHistory.push(digit);
    if (tickHistory.length > min) tickHistory.shift();

    // Flash active
    const box = document.getElementById(`dbox-${digit}`);
    if (box) { box.classList.add('active-tick'); setTimeout(() => box.classList.remove('active-tick'), 200); }

    updateUI(tickHistory.length, min);

    // Update state if collecting → ready
    if (tickHistory.length >= min && botState === State.COLLECTING) setState(State.READY);
}

function updateUI(count, min) {
    document.getElementById('tickCounter').innerText = `${count} / ${min}`;
    const counts = {};
    tickHistory.forEach(x => counts[x] = (counts[x] || 0) + 1);

    let stats = [];
    for (let i = 0; i <= 9; i++) {
        const p = count === 0 ? 0 : (counts[i] || 0) / count * 100;
        displayedPercentages[i] += (p - displayedPercentages[i]) * 0.2;
        document.getElementById(`dp-${i}`).innerText = displayedPercentages[i].toFixed(1) + '%';
        document.getElementById(`dbox-${i}`).classList.remove('cold-digit', 'second-cold-digit', 'random-digit');
        stats.push({ digit: i, perc: p });
    }

    let finalTarget = -1;

    if (isEntropyMode) {
        finalTarget = randInt(0, 9);
        document.getElementById(`dbox-${finalTarget}`).classList.add('random-digit');
        currentMinPerc = displayedPercentages[finalTarget];
    } else {
        stats.sort((a, b) => a.perc - b.perc);
        const safeFloor = parseFloat(document.getElementById('safeFloor').value);
        let candidate = stats[0];

        if (candidate.perc < safeFloor && stats.length > 1) {
            candidate = stats[1];
            document.getElementById(`dbox-${stats[0].digit}`).classList.add('cold-digit');
            document.getElementById(`dbox-${stats[1].digit}`).classList.add('second-cold-digit');
        } else {
            document.getElementById(`dbox-${candidate.digit}`).classList.add('cold-digit');
        }
        finalTarget = candidate.digit;
        currentMinPerc = candidate.perc;
    }

    if (manualOverrideDigit === null) {
        if (count < min) {
            updateTargetBoxVisuals(null, false);
        } else if (currentTargetDigit !== finalTarget) {
            currentTargetDigit = finalTarget;
            updateTargetBoxVisuals(finalTarget, false);
        }
    }
}

function updateTargetBoxVisuals(digit, isManual) {
    const displayEl = document.getElementById('targetDigitDisplay');
    const statusEl = document.getElementById('targetStatusMsg');
    const targetBox = document.getElementById('targetBox');

    if (digit === null) {
        displayEl.innerText = '⏳';
        statusEl.innerText = 'Collecting data...';
        targetBox.style.borderColor = 'var(--accent-orange)';
        targetBox.style.background = 'var(--accent-blue-dim)';
        return;
    }

    const newVal = digit.toString();
    if (displayEl.innerText !== newVal) {
        displayEl.classList.add('slide-out-up');
        setTimeout(() => {
            displayEl.innerText = newVal;
            displayEl.classList.remove('slide-out-up');
            displayEl.classList.add('slide-in-up');
            void displayEl.offsetWidth;
            displayEl.classList.remove('slide-in-up');
        }, 300);
    }

    const box = document.getElementById(`dbox-${digit}`);
    const isSafe = box.classList.contains('second-cold-digit');
    const isRandom = box.classList.contains('random-digit');

    if (isManual) {
        statusEl.innerText = `Manual: ${digit}`;
        targetBox.style.borderColor = 'var(--accent-orange)';
        targetBox.style.background = 'var(--accent-orange-dim)';
    } else if (isRandom) {
        statusEl.innerText = `🎲 Entropy: ${digit}`;
        targetBox.style.borderColor = 'var(--accent-purple)';
        targetBox.style.background = 'var(--accent-purple-dim)';
    } else if (isSafe) {
        statusEl.innerText = `⚠️ Safe Floor → 2nd Coldest`;
        targetBox.style.borderColor = 'var(--accent-orange)';
        targetBox.style.background = 'var(--accent-orange-dim)';
    } else {
        statusEl.innerText = `Coldest: ${digit} (${currentMinPerc.toFixed(1)}%)`;
        targetBox.style.borderColor = 'var(--accent-blue)';
        targetBox.style.background = 'var(--accent-blue-dim)';
    }
}

// ── Trading Engine ──
async function placeSingleManualTrade() {
    if (isRunning) return;
    resetStake();
    startRunState();
    setState(State.TRADING);
    await executeSingleTrade();
    endRunState();
    if (!isRunning && botState !== State.PAUSED) setState(State.READY);
}

async function runCustomSequence(internalCall = false) {
    if (isRunning && !internalCall) return;
    startRunState();
    setState(State.TRADING);

    const length = parseInt(document.getElementById('seqLength').value) || 1;

    for (let i = 0; i < length; i++) {
        if (shouldStop && martingaleStep === 0) break;

        updateProgress(i + 1, length);

        const delayEl = document.getElementById(`seq-delay-${i}`);
        const delayVal = delayEl ? delayEl.value : 'random';
        let waitTime = delayVal === 'random' ? randInt(2, 6) : parseInt(delayVal);

        if (waitTime > 0 && martingaleStep === 0) {
            showCountdown(delayVal === 'random' ? 'RND DELAY' : 'WAITING', waitTime);
            for (let s = waitTime; s > 0; s--) {
                if (shouldStop && martingaleStep === 0) break;
                document.getElementById('countdownTimer').innerText = s;
                await sleep(1000);
            }
            hideCountdown();
        }

        if (shouldStop && martingaleStep === 0) break;
        while (isPaused) await sleep(500);

        await executeSingleTrade();
    }

    // Relentless Recovery loop
    const maxRecovery = parseInt(document.getElementById('martingaleLimit').value);
    while (martingaleStep > 0 && martingaleStep <= maxRecovery && !shouldStop) {
        log(`⚠️ Recovery trade...`, 'log-warn');
        setState(State.RECOVERY);
        updateProgress(length, length);
        while (isPaused) await sleep(1000);
        await executeSingleTrade();
    }

    if (!internalCall) {
        endRunState();
        if (botState !== State.PAUSED) setState(State.READY);
    }
}

async function executeSingleTrade() {
    const target = manualOverrideDigit !== null ? manualOverrideDigit : currentTargetDigit;

    if (target === null) {
        log('⚠️ No target digit — skipping', 'log-warn');
        return; // FIX: no hanging promise
    }

    return new Promise((resolve) => {
        tradeResolver = resolve;

        // FIX: Safety timeout (30s) to prevent infinite hangs
        tradeTimeout = setTimeout(() => {
            log('⚠️ Trade timeout (30s) — forcing resolve', 'log-warn');
            tradeResolver = null;
            tradeTimeout = null;
            resolve();
        }, 30000);

        ws.send(JSON.stringify({
            proposal: 1,
            amount: Number(currentStake), // FIX: ensure number type
            barrier: target,
            basis: 'stake',
            contract_type: 'DIGITDIFF',
            currency: 'USD',
            duration: 1,
            duration_unit: 't',
            symbol: document.getElementById('market').value,
        }));
    });
}

// ── UI State Helpers ──
function startRunState() {
    isRunning = true;
    shouldStop = false;
    document.getElementById('loadingBar').style.display = 'block';
    document.getElementById('btnStop').style.display = 'block';
    document.getElementById('btnStartCustom').disabled = true;
    document.getElementById('btnSingle').disabled = true;
}

function endRunState() {
    isRunning = false;
    document.getElementById('btnStop').style.display = 'none';
    document.getElementById('loadingBar').style.display = 'none';
    document.getElementById('progressFill').style.width = '0%';
    if (!isAutoPilot) {
        document.getElementById('btnStartCustom').disabled = false;
        document.getElementById('btnSingle').disabled = false;
    }
}

function stopTrading() {
    shouldStop = true;
    isPaused = false;

    if (isAutoPilot) {
        document.getElementById('autoPilotToggle').checked = false;
        toggleAutoPilot();
    }

    // FIX: Force resolve any pending trade to unblock sequence
    resolveCurrentTrade();
    endRunState();
    setState(State.READY);
    log('🛑 STOPPED', 'log-warn');
}

function updateProgress(current, total) {
    const fill = document.getElementById('progressFill');
    const text = document.getElementById('progressText');
    fill.style.width = (current / total) * 100 + '%';

    if (martingaleStep > 0) {
        fill.style.background = 'var(--accent-red)';
        text.innerText = `⚠️ RECOVERY ${martingaleStep}`;
    } else {
        fill.style.background = 'linear-gradient(90deg, #8b5cf6, #6d28d9)';
        text.innerText = `Trade ${current} / ${total}`;
    }
}

// ── Data Reset ──
function resetData() {
    tickHistory = [];
    currentTargetDigit = null;
    manualOverrideDigit = null;
    displayedPercentages = new Array(10).fill(0);
    updateUI(0, parseInt(document.getElementById('tickMinimum').value) || 50);
}

function enforceMinimum() {
    const min = parseInt(document.getElementById('tickMinimum').value) || 50;
    if (tickHistory.length > min) tickHistory = tickHistory.slice(-min);
    updateUI(tickHistory.length, min);
}

// ── Countdown Display ──
function showCountdown(label, seconds) {
    document.getElementById('countdownOverlay').style.display = 'block';
    document.getElementById('countdownLabel').innerText = label;
    document.getElementById('countdownTimer').innerText = typeof seconds === 'number' ? seconds.toFixed(1) : seconds;
}
function hideCountdown() {
    document.getElementById('countdownOverlay').style.display = 'none';
}

// ── Logging ──
function log(msg, cls) {
    const area = document.getElementById('logArea');
    const time = new Date().toLocaleTimeString();
    area.innerHTML = `<div class="${cls}">[${time}] ${msg}</div>` + area.innerHTML;

    // Keep log manageable
    if (area.children.length > 200) {
        while (area.children.length > 150) area.removeChild(area.lastChild);
    }
}

function clearLog() {
    document.getElementById('logArea').innerHTML = '';
}

// ── Utilities ──
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
